<!DOCTYPE html>
<html lang="en">
    <head>
        
        <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Register - BloodConnect</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>

        </header>
        <main>
            <section class="panel narrow"><h2>Create an account</h2>
            <div class="tabs"><button type="button" class="active" data-mode="user">User</button><button type="button" data-mode="bank">Blood bank</button></div>
            <form id="registerForm">
            <div id="userFields">
            <div class="field"><label for="name">Full name</label><input id="name"></div>
            <div class="field"><label for="phone">Phone</label><input id="phone" type="tel"></div>
            <div class="field"><label for="bloodGroup">Blood group</label><select id="bloodGroup"></select></div>
            <div class="field"><label for="city">City</label><input id="city"></div>
            <label><input type="checkbox" id="donor" style="width:auto"> Also register me as a voluntary donor</label></div>
            <div id="bankFields" hidden>
            <div class="field"><label for="bankName">Blood bank name</label><input id="bankName"></div>
            <div class="field"><label for="address">Address</label><input id="address"></div>
            <div class="field"><label for="bcity">City</label><input id="bcity"></div>
            <div class="field"><label for="contactNumber">Contact number</label><input id="contactNumber"></div>
            <div class="field"><label for="licenseNo">Licence number</label><input id="licenseNo"></div></div>
            <div class="field"><label for="email">Email</label><input id="email" type="email"></div>
            <div class="field"><label for="password">Password (6+ characters)</label><input id="password" type="password"></div>
            <button type="submit">Register</button></form><div id="msg" class="msg"></div>
            <p>Already registered? <a href="login.html">Log in</a></p></section>
        </main>
        <footer>BloodConnect: Blood Bank Portal &middot; Manipal University Jaipur</footer>
        <script src="js/common.js"></script>
        <script src="js/auth.js"></script>
    </body>
    </html>
